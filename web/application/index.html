<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f36b21"><title>ENSPY — Télécharger l’application</title>
<meta name="description" content="Téléchargez la dernière version officielle de l’application mobile ENSPY."><link rel="icon" href="/favicon.svg">
<style>
:root{--orange:#f36b21;--orange2:#d95612;--ink:#18120e;--muted:#756a63;--cream:#fff9f5;--line:#eadfd7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 0%,#ffe8d9,transparent 34%),var(--cream)}
body{padding:18px}.wrap{width:min(980px,100%);margin:auto}.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 28px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{width:48px;height:48px;border-radius:15px;object-fit:cover;background:#fff;box-shadow:0 8px 24px #2d170c18}.admin{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 55px #2d170c10}.main-card{padding:clamp(22px,5vw,48px)}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--orange2)}h1{font-size:clamp(34px,7vw,64px);line-height:.98;margin:10px 0 16px;letter-spacing:-.045em}.subtitle{font-size:clamp(16px,2.3vw,20px);line-height:1.55;color:var(--muted)}.version{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:24px 0}.pill{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff1e8;border:1px solid #ffd7bf;font-weight:800;color:var(--ink)}.meta,.small{color:var(--muted);font-size:13px;line-height:1.5}.download{display:flex;justify-content:center;padding:15px 18px;border-radius:15px;background:linear-gradient(135deg,var(--orange),var(--orange2));color:#fff;font-weight:800;font-size:17px}.note{margin-top:18px;padding:15px;border-radius:15px;background:#fffaf6;border:1px solid var(--line);white-space:pre-wrap;line-height:1.55;color:#4e4540}.side{padding:24px}.side h2{margin-top:0}.feature{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.feature:last-child{border-bottom:0}.icon{width:38px;height:38px;border-radius:12px;background:#fff0e6;display:grid;place-items:center;flex:0 0 auto}.history{margin-top:22px;padding:22px}.release{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.release:last-child{border-bottom:0}.empty{text-align:center;padding:40px;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 0}
@media(max-width:720px){body{padding:10px}.header{padding:5px 4px 16px}.admin{display:none}.hero{grid-template-columns:1fr}.card{border-radius:20px}.main-card,.side,.history{padding:20px}h1{font-size:42px}.release{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<header class="header"><div class="brand"><img class="logo" src="/assets/enspy-logo.jpg" alt="ENSPY"><span>ENSPY</span></div><a class="admin" href="/">Espace administration →</a></header>
<main id="app"></main><footer class="footer">© ENSPY · Application mobile officielle</footer></div>
<script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=n=>{n=Number(n||0);if(n<1024)return n+' o';if(n<1048576)return (n/1024).toFixed(0)+' Ko';if(n<1073741824)return (n/1048576).toFixed(1)+' Mo';return (n/1073741824).toFixed(2)+' Go'};
async function load(){const el=document.querySelector('#app');try{const r=await fetch('/api/app/releases',{headers:{Accept:'application/json'}});const releases=await r.json();if(!r.ok)throw new Error(releases?.error||'Impossible de charger les versions.');const latest=releases[0];if(!latest){el.innerHTML='<section class="card main-card empty"><h1>Application ENSPY</h1><p>Aucune version n’est encore publiée.</p></section>';return}
el.innerHTML=`<section class="hero"><article class="card main-card"><div class="eyebrow">APPLICATION MOBILE OFFICIELLE</div><h1>ENSPY,<br>dans votre poche.</h1><p class="subtitle">Téléchargez la dernière version de l’application pour accéder aux ressources académiques, au forum, à l’agenda et aux fonctionnalités hors ligne.</p><div class="version"><span class="pill">Version ${esc(latest.versionName)}</span><span class="meta">Build ${latest.versionCode} · ${fmt(latest.fileSize)}</span></div><a class="download" href="${esc(latest.downloadUrl)}">↓ Télécharger l’APK</a><div class="small" style="margin-top:12px;text-align:center">Installation Android · fichier APK officiel ENSPY</div>${latest.releaseNotes?`<div class="note"><strong>Nouveautés</strong><br>${esc(latest.releaseNotes)}</div>`:''}</article>
<aside class="card side"><h2>Pourquoi l’application ?</h2><div class="feature"><div class="icon">▤</div><div><strong>Ressources</strong><div class="small">Cours, TD, TP, épreuves et documents accessibles rapidement.</div></div></div><div class="feature"><div class="icon">◉</div><div><strong>Communauté</strong><div class="small">Forum étudiant et annonces de l’ENSPY.</div></div></div><div class="feature"><div class="icon">▣</div><div><strong>Agenda</strong><div class="small">Événements et rappels académiques.</div></div></div><div class="feature"><div class="icon">↧</div><div><strong>Hors ligne</strong><div class="small">Conservez vos documents téléchargés pour les consulter sans connexion.</div></div></div></aside></section>
<section class="card history"><div class="eyebrow">VERSIONS PUBLIÉES</div><h2 style="margin:6px 0 4px">Historique</h2>${releases.map(r=>`<div class="release"><div><strong>ENSPY ${esc(r.versionName)}</strong><div class="small">Build ${r.versionCode} · ${fmt(r.fileSize)} · ${r.downloadCount} téléchargement(s)</div></div>${r.isActive?`<a href="${esc(r.downloadUrl)}" class="pill">Télécharger</a>`:`<span class="pill" style="opacity:.6">Archivée</span>`}</div>`).join('')}</section>`;
}catch(e){el.innerHTML='<section class="card main-card empty"><h1>Oups.</h1><p>'+esc(e.message)+'</p><button onclick="load()" class="pill" style="cursor:pointer">Réessayer</button></section>'}}
load();
</script></body></html>
